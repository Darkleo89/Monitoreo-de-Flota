<style>
/* ══════════════════════════════════════════════════════════════════
   MONITOR DE FLOTA PRO · CSS.html v6.1 — Base + Adiciones
   ══════════════════════════════════════════════════════════════════ */

/* ── VARIABLES ──────────────────────────────────────────────────── */
:root {
  --font:  'Inter', system-ui, sans-serif;
  --mono:  'JetBrains Mono', 'Fira Code', monospace;

  --bg:    #0d1117;
  --bg2:   #161b22;
  --bg3:   #1c2128;
  --sur:   #21262d;
  --sur2:  #30363d;
  --sur3:  #373e47;

  --bdr:   #30363d;
  --bdr2:  #444c56;

  --txt:   #e6edf3;
  --txt2:  #8b949e;
  --txt3:  #6e7681;

  --blue:      #58a6ff;
  --blue-bg:   rgba(56,139,253,.10);
  --blue-br:   rgba(56,139,253,.25);

  --green:     #3fb950;
  --green-bg:  rgba(63,185,80,.10);
  --green-br:  rgba(63,185,80,.25);

  --red:       #f85149;
  --red-bg:    rgba(248,81,73,.10);
  --red-br:    rgba(248,81,73,.25);

  --yellow:    #d29922;
  --yellow-bg: rgba(210,153,34,.10);
  --yellow-br: rgba(210,153,34,.25);

  --teal:      #39d353;
  --teal-bg:   rgba(57,211,83,.10);
  --teal-br:   rgba(57,211,83,.25);

  --purple:    #a371f7;
  --purple-bg: rgba(163,113,247,.10);
  --purple-br: rgba(163,113,247,.25);

  --orange:    #f0883e;

  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}

/* ── RESET ──────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--txt); font-size: 13px; }
a { text-decoration: none; color: inherit; }
input, select, textarea, button { font-family: var(--font); font-size: 13px; color: var(--txt); }
.hidden { display: none !important; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
@keyframes spin   { to { transform: rotate(360deg); } }
@keyframes pulse  { 0%,100% { opacity:1; } 50% { opacity:.4; } }

/* ── LOGIN ──────────────────────────────────────────────────────── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 30% 50%, rgba(56,139,253,.06) 0%, transparent 60%),
              var(--bg);
}

.login-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  width: min(900px, 95vw);
  min-height: 500px;
  background: var(--sur);
  border: 1px solid var(--bdr);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
}

.login-left {
  padding: 48px 40px;
  background: linear-gradient(145deg, var(--bg2) 0%, var(--bg3) 100%);
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.ll-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.ll-brand {
  font-size: 15px;
  font-weight: 600;
  color: var(--txt);
}

.ll-sub {
  font-size: 11px;
  color: var(--txt3);
  margin-top: 1px;
}

.ll-tagline {
  font-size: 28px;
  font-weight: 300;
  color: var(--txt2);
  line-height: 1.3;
}

.ll-tagline span {
  color: var(--blue);
  font-weight: 500;
}

.ll-features {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: auto;
}

.lf-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--txt2);
}

.lf-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.login-right {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.login-card {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.lc-title {
  font-size: 20px;
  font-weight: 600;
}

.lc-sub {
  font-size: 11px;
  color: var(--txt3);
  margin-top: -12px;
}

/* ── TOPBAR ─────────────────────────────────────────────────────── */
#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  background: var(--bg2);
  border-bottom: 1px solid var(--bdr);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  z-index: 100;
}

.tb-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.tb-center{ display: flex; align-items: center; justify-content: center; }
.tb-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.tb-logo  { display: flex; align-items: center; }
.tb-brand { font-weight: 600; font-size: 13px; white-space: nowrap; }
.tb-sep   { width: 1px; height: 20px; background: var(--bdr); margin: 0 4px; }

.tb-clock {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--txt3);
  white-space: nowrap;
}

.tb-user {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  background: var(--sur);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
}

.tu-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--blue-bg);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--blue-br);
}

.tu-name  { font-size: 12px; font-weight: 500; }
.tu-meta  { font-size: 10px; color: var(--txt3); }

.tb-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: var(--radius);
  border: 1px solid var(--bdr);
  background: transparent;
  color: var(--txt2);
  cursor: pointer;
  transition: all .15s;
}

.tb-btn:hover { background: var(--sur); color: var(--txt); }
.tb-btn-danger:hover { border-color: var(--red-br); color: var(--red); background: var(--red-bg); }

/* Tabs de estación */
.estacion-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
}

.est-tab {
  padding: 4px 10px;
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 500;
  color: var(--txt3);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
  white-space: nowrap;
}

.est-tab:hover { color: var(--txt); background: var(--sur); }
.est-tab.active {
  color: var(--blue);
  background: var(--blue-bg);
  border-color: var(--blue-br);
}

/* Ticker */
.ticker {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border-radius: 99px;
  border: 1px solid var(--bdr);
  font-size: 11px;
  color: var(--txt2);
  transition: all .3s;
}

.ticker-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}

.ticker.warn  { border-color: var(--yellow-br); color: var(--yellow); }
.ticker.alert { border-color: var(--red-br); color: var(--red); }
.ticker.alert .ticker-dot { background: var(--red); }
.ticker.warn  .ticker-dot { background: var(--yellow); }

/* Chips de clima */
#climaChips { display: flex; gap: 5px; }

.clima-chip {
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--yellow-br);
  background: var(--yellow-bg);
  color: var(--yellow);
  font-size: 10px;
  font-weight: 600;
  font-family: var(--mono);
  cursor: pointer;
  transition: all .15s;
}

.clima-chip.vencido {
  border-color: var(--red-br);
  background: var(--red-bg);
  color: var(--red);
  animation: pulse 1s infinite;
}

/* ── SIDEBAR ────────────────────────────────────────────────────── */
#sidebar {
  position: fixed;
  top: 48px;
  left: 0;
  bottom: 0;
  width: 200px;
  background: var(--bg2);
  border-right: 1px solid var(--bdr);
  display: flex;
  flex-direction: column;
  padding: 12px 8px;
  gap: 4px;
  overflow-y: auto;
  z-index: 50;
}

.nav-section { margin-bottom: 4px; }

.ns-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--txt3);
  padding: 6px 8px 4px;
  font-family: var(--mono);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--txt2);
  font-size: 13px;
  transition: all .12s;
  border: 1px solid transparent;
  position: relative;
}

.nav-item:hover { background: var(--sur); color: var(--txt); }
.nav-item.active {
  background: var(--blue-bg);
  color: var(--blue);
  border-color: var(--blue-br);
}

.ni-ico {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.ni-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

.ni-pill {
  margin-left: auto;
  font-size: 9px;
  font-weight: 600;
  background: var(--sur3);
  color: var(--txt3);
  padding: 2px 6px;
  border-radius: 99px;
  border: 1px solid var(--bdr);
}

.sidebar-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  font-size: 10px;
  color: var(--txt3);
}

.poll-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.poll-dot.syncing { animation: pulse 1s infinite; }

/* ── MAIN ───────────────────────────────────────────────────────── */
#main {
  margin-top: 48px;
  margin-left: 200px;
  padding: 16px;
  min-height: calc(100vh - 48px);
}

.view { animation: fadeIn .18s ease; }
.view.hidden { display: none !important; }

/* ── KPI ROW ────────────────────────────────────────────────────── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.kpi-card {
  background: var(--sur);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 12px 14px 10px;
  position: relative;
  overflow: hidden;
}

.kpi-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--txt3);
}

.kc-val {
  font-size: 24px;
  font-weight: 600;
  font-family: var(--mono);
  line-height: 1;
}

.kc-lbl {
  font-size: 10px;
  color: var(--txt3);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.kc-green  .kc-val { color: var(--green); }
.kc-green::after   { background: var(--green); }
.kc-blue   .kc-val { color: var(--blue); }
.kc-blue::after    { background: var(--blue); }
.kc-teal   .kc-val { color: var(--teal); }
.kc-teal::after    { background: var(--teal); }
.kc-red    .kc-val { color: var(--red); }
.kc-red::after     { background: var(--red); }
.kc-yellow .kc-val { color: var(--yellow); }
.kc-yellow::after  { background: var(--yellow); }
.kc-purple .kc-val { color: var(--purple); }
.kc-purple::after  { background: var(--purple); }
.kc-muted  .kc-val { color: var(--txt2); }

/* ── DASHBOARD GRID ─────────────────────────────────────────────── */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 14px;
  align-items: start;
}

.dash-right { display: flex; flex-direction: column; gap: 10px; }

/* ── PANELS ─────────────────────────────────────────────────────── */
.panel {
  background: var(--sur);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel-sm { overflow: visible; }

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--bdr);
  gap: 10px;
}

.ph-left  { display: flex; align-items: center; gap: 8px; }
.ph-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ph-title { font-weight: 600; font-size: 13px; }
.ph-count {
  font-size: 11px;
  color: var(--txt3);
  background: var(--sur2);
  padding: 2px 7px;
  border-radius: 99px;
  border: 1px solid var(--bdr);
}

.mt12 { margin-top: 12px; }
.mt8  { margin-top: 8px; }

/* ── VIEW HEADS ─────────────────────────────────────────────────── */
.view-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.vh-title {
  font-size: 16px;
  font-weight: 600;
  flex: 1;
}

.vh-hint {
  font-size: 11px;
  color: var(--txt3);
}

.vh-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── TABLE ──────────────────────────────────────────────────────── */
.tbl-wrap {
  overflow-x: auto;
}

.data-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.data-tbl th {
  padding: 8px 10px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--txt3);
  background: var(--bg2);
  border-bottom: 1px solid var(--bdr);
  white-space: nowrap;
}

.data-tbl td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--bdr);
  vertical-align: middle;
}

.data-tbl tbody tr:last-child td { border-bottom: none; }

.data-tbl tbody tr:hover td {
  background: var(--sur2);
}

.tbl-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 32px;
  color: var(--txt3);
  font-size: 12px;
}

/* Colores de fila */
.row-sub td { border-left: 2px solid var(--teal);  }
.row-baj td { border-left: 2px solid var(--blue);  }
.row-det td { border-left: 2px solid var(--red);   }
.row-alerta { background: rgba(248,81,73,.04); }

/* ── BADGES ─────────────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
}

.bg-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-br); }
.bg-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-br); }
.bg-teal   { background: var(--teal-bg);   color: var(--teal);   border-color: var(--teal-br); }
.bg-red    { background: var(--red-bg);    color: var(--red);    border-color: var(--red-br); }
.bg-yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-br); }
.bg-purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-br); }
.bg-gray   { background: var(--sur2); color: var(--txt3); border-color: var(--bdr); }

/* ── SYSTEM INDICATORS ──────────────────────────────────────────── */
.sys-ic {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}

.si-ok { background: var(--green-bg); color: var(--green); }
.si-no { background: var(--red-bg);   color: var(--red); }
.si-na { background: var(--sur2); color: var(--txt3); }

/* ── SLA COLORS ─────────────────────────────────────────────────── */
.sla-ok     { color: var(--green); font-family: var(--mono); font-size: 11px; }
.sla-warn   { color: var(--yellow); font-family: var(--mono); font-size: 11px; }
.sla-breach { color: var(--red); font-family: var(--mono); font-size: 11px; font-weight: 700; }

/* ── TD HELPERS ─────────────────────────────────────────────────── */
.td-uni   { font-family: var(--mono); font-weight: 600; font-size: 12px; }
.td-mono  { font-family: var(--mono); }
.td-muted { color: var(--txt3); }

/* ── FORMS ──────────────────────────────────────────────────────── */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.field-group label {
  font-size: 11px;
  font-weight: 600;
  color: var(--txt2);
  text-transform: uppercase;
  letter-spacing: .4px;
}

.field-group input,
.field-group select,
.field-group textarea {
  background: var(--bg2);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 7px 10px;
  color: var(--txt);
  outline: none;
  transition: border-color .15s;
  width: 100%;
}

.field-group input:focus,
.field-group select:focus,
.field-group textarea:focus {
  border-color: var(--blue);
}

.pass-wrap {
  position: relative;
}

.pass-wrap input {
  padding-right: 36px;
}

.pass-toggle {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--txt3);
  padding: 0;
  display: flex;
}

.inp-date {
  background: var(--bg2);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 5px 8px;
  color: var(--txt);
  outline: none;
  font-size: 12px;
}

.inp-select {
  background: var(--bg2);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 5px 8px;
  color: var(--txt);
  outline: none;
  font-size: 12px;
}

.lf-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 10px;
}

/* ── BUTTONS ────────────────────────────────────────────────────── */
.btn-login {
  width: 100%;
  padding: 10px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .15s;
}

.btn-login:hover { opacity: .88; }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }

.btn-primary {
  padding: 7px 14px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity .15s;
}

.btn-primary:hover { opacity: .88; }

.btn-danger {
  padding: 7px 14px;
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-br);
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}

.btn-danger:hover { background: rgba(248,81,73,.18); }

.btn-ghost {
  padding: 7px 14px;
  background: transparent;
  color: var(--txt2);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}

.btn-ghost:hover { background: var(--sur2); color: var(--txt); }

.btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--bdr);
  background: transparent;
  color: var(--txt2);
  cursor: pointer;
  transition: all .15s;
}

.btn-icon:hover { background: var(--sur2); color: var(--txt); }

.btn-link {
  background: none;
  border: none;
  color: var(--blue);
  font-size: 11px;
  cursor: pointer;
  padding: 0;
}

.btn-link:hover { text-decoration: underline; }

.btn-sm-primary {
  padding: 4px 10px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.btn-sm-success {
  padding: 3px 8px;
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid var(--green-br);
  border-radius: var(--radius);
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all .12s;
}

.btn-sm-success:hover { background: rgba(63,185,80,.18); }

.btn-barr {
  padding: 4px 9px;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid var(--blue-br);
  border-radius: var(--radius);
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.btn-gps {
  padding: 6px 12px;
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid var(--green-br);
  border-radius: var(--radius);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.gps-pulse {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 1.2s infinite;
}

/* ── SEARCH ─────────────────────────────────────────────────────── */
.search-inp {
  background: var(--bg2);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 5px 10px;
  color: var(--txt);
  outline: none;
  font-size: 12px;
  width: 160px;
  transition: border-color .15s;
}

.search-inp:focus { border-color: var(--blue); }

/* ── FILTER BUTTONS ─────────────────────────────────────────────── */
.filter-row { display: flex; gap: 3px; }

.fb {
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--bdr);
  background: transparent;
  color: var(--txt3);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all .12s;
}

.fb:hover { background: var(--sur2); color: var(--txt); }
.fb.active { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-br); }
.fb-red.active { background: var(--red-bg); color: var(--red); border-color: var(--red-br); }

/* ── TOGGLES ────────────────────────────────────────────────────── */
.tog-row { display: flex; gap: 4px; flex-wrap: wrap; }

.tog {
  padding: 5px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--bdr);
  background: transparent;
  color: var(--txt3);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .12s;
}

.tog:hover { background: var(--sur2); color: var(--txt); }
.tog-active-blue   { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-br); }
.tog-active-purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-br); }
.tog-active-yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-br); }
.tog-active-green  { background: var(--green-bg);  color: var(--green);  border-color: var(--green-br); }
.tog-active-gray   { background: var(--sur2); color: var(--txt2); border-color: var(--bdr2); }

/* ── MODALES ────────────────────────────────────────────────────── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}

.modal {
  background: var(--bg2);
  border: 1px solid var(--bdr);
  border-radius: 10px;
  width: min(520px, 100%);
  box-shadow: 0 16px 48px rgba(0,0,0,.7);
  animation: fadeIn .18s ease;
}

.modal-lg    { width: min(720px, 100%); }
.modal-proto { width: min(600px, 100%); }

.modal-head {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--bdr);
  gap: 10px;
}

.modal-title {
  font-weight: 600;
  font-size: 14px;
  flex: 1;
}

.modal-close {
  background: none;
  border: none;
  color: var(--txt3);
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius);
}

.modal-close:hover { background: var(--sur2); color: var(--txt); }

.modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 60vh;
  overflow-y: auto;
}

.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--bdr);
}

/* ── SLA ITEMS ──────────────────────────────────────────────────── */
.sla-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--bdr);
}

.sla-item:last-child { border-bottom: none; }
.sla-item.breach { background: rgba(248,81,73,.05); }

.si-timer {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  min-width: 60px;
  text-align: right;
}

.si-timer.ok    { color: var(--green); }
.si-timer.warn  { color: var(--yellow); }
.si-timer.breach{ color: var(--red); }

.si-tipo { font-weight: 600; font-size: 12px; }
.si-meta { font-size: 10px; color: var(--txt3); margin-top: 2px; }
.si-body { flex: 1; }

/* Mini SLA (dashboard) */
.sla-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--bdr);
}

.sla-mini:last-child { border-bottom: none; }
.sla-mini.breach { background: rgba(248,81,73,.05); }

.sm-timer { font-family: var(--mono); font-size: 16px; font-weight: 700; min-width: 44px; }
.sm-tipo  { font-size: 11px; font-weight: 600; }
.sm-ref   { font-size: 10px; color: var(--txt3); }
.sm-body  { flex: 1; }

/* ── NOVEDADES ──────────────────────────────────────────────────── */
.nov-item {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--bdr);
  align-items: flex-start;
}

.nov-item:last-child { border-bottom: none; }
.nov-item.acc  { border-left: 2px solid var(--red); }
.nov-item.fall { border-left: 2px solid var(--yellow); }
.nov-item.inf  { border-left: 2px solid var(--purple); }
.nov-item.oth  { border-left: 2px solid var(--blue); }

.ni-ico   { font-size: 18px; flex-shrink: 0; }
.ni-body  { flex: 1; }
.ni-title { font-weight: 600; font-size: 12px; }
.ni-meta  { font-size: 10px; color: var(--txt3); margin-top: 2px; }

.ni-proto {
  font-size: 10px;
  color: var(--blue);
  cursor: pointer;
  margin-top: 4px;
}

.ni-proto:hover { text-decoration: underline; }

/* Mini novedades (dashboard) */
.nov-mini {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--bdr);
}

.nov-mini:last-child { border-bottom: none; }
.nm-ico   { font-size: 14px; flex-shrink: 0; }
.nm-body  { flex: 1; min-width: 0; }
.nm-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm-meta  { font-size: 10px; color: var(--txt3); }

/* ── TIMERS MINI ────────────────────────────────────────────────── */
.timer-mini {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--bdr);
}

.timer-mini:last-child { border-bottom: none; }
.tm-uni   { font-size: 11px; flex: 1; }
.tm-time  { font-family: var(--mono); font-size: 14px; font-weight: 700; }
.tm-ok    { color: var(--green); }
.tm-warn  { color: var(--yellow); }
.tm-venc  { color: var(--red); animation: pulse 1s infinite; }

/* ── ENGANCHE D&D ───────────────────────────────────────────────── */
.enganche-layout {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 14px;
  align-items: start;
  margin-bottom: 14px;
}

.eng-col { min-height: 300px; }

.eng-pool {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 200px;
  max-height: 400px;
  overflow-y: auto;
}

.eng-item {
  padding: 8px 10px;
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  background: var(--sur);
  cursor: grab;
  transition: all .12s;
  user-select: none;
}

.eng-item:hover     { border-color: var(--bdr2); background: var(--sur2); }
.eng-item.dragging  { opacity: .5; }
.eng-item.drop-target { border-color: var(--blue); background: var(--blue-bg); }

.u-sub { border-left: 2px solid var(--teal); }
.u-baj { border-left: 2px solid var(--blue); }
.u-det { border-left: 2px solid var(--red);  }

.ei-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ei-id  { font-family: var(--mono); font-weight: 600; font-size: 12px; }
.ei-meta{ font-size: 10px; color: var(--txt3); margin-top: 3px; }

.eng-dropzone {
  width: 100px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 2px dashed var(--bdr);
  border-radius: var(--radius);
  color: var(--txt3);
  transition: all .15s;
}

.eng-dropzone.over {
  border-color: var(--blue);
  background: var(--blue-bg);
  color: var(--blue);
}

.edz-label { font-size: 11px; font-weight: 600; text-align: center; }
.edz-hint  { font-size: 10px; text-align: center; }

/* Confirmación enganche */
.eng-confirm {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 0;
}

.ec-box {
  padding: 10px 18px;
  border-radius: var(--radius);
  font-family: var(--mono);
  font-weight: 700;
  font-size: 16px;
  border: 1px solid;
}

.ec-uni  { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-br); }
.ec-equi { background: var(--green-bg);  color: var(--green);  border-color: var(--green-br); }
.ec-arrow{ font-size: 20px; color: var(--txt3); }

/* ── TIMELINE (movimientos) ─────────────────────────────────────── */
.tl-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--bdr);
}

.tl-item:last-child { border-bottom: none; }

.tl-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 1px;
}

.tld-eng { background: var(--blue-bg);   color: var(--blue); }
.tld-cam { background: var(--purple-bg); color: var(--purple); }
.tld-dej { background: var(--yellow-bg); color: var(--yellow); }
.tld-rec { background: var(--green-bg);  color: var(--green); }

.tl-body  { flex: 1; }
.tl-title { font-size: 12px; font-weight: 600; }
.tl-meta  { font-size: 10px; color: var(--txt3); margin-top: 2px; }
.tl-time  { font-size: 10px; color: var(--txt3); font-family: var(--mono); white-space: nowrap; }

/* ── PROTOCOLOS ─────────────────────────────────────────────────── */
.proto-urgente {
  font-size: 10px;
  font-weight: 700;
  color: var(--yellow);
  background: var(--yellow-bg);
  padding: 3px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--yellow-br);
}

.proto-paso {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--bdr);
}

.proto-paso:last-child { border-bottom: none; }

.pp-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid var(--blue-br);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.pp-tit { font-weight: 600; font-size: 13px; }
.pp-det { font-size: 11px; color: var(--txt2); margin-top: 3px; }

.proto-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
  border-top: 1px solid var(--bdr);
  margin-top: 8px;
}

.proto-sla {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--txt2);
}

.proto-sla-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 1s infinite;
}

.proto-timer {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--red);
}

/* ── RELEVO ─────────────────────────────────────────────────────── */
.relevo-kpi {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.rk-card {
  background: var(--sur);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}

.rk-val { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.rk-lbl { font-size: 10px; color: var(--txt3); margin-top: 3px; }

.riesgo-list { display: flex; flex-direction: column; gap: 6px; padding: 0 0 8px; }

.rl-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: rgba(248,81,73,.05);
  border: 1px solid var(--red-br);
  border-radius: var(--radius);
  font-size: 12px;
}

.rl-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}

/* ── MOVIMIENTOS LAYOUT ─────────────────────────────────────────── */
.mov-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ── BF SECTION ─────────────────────────────────────────────────── */
.bf-section { margin-bottom: 14px; }
.bf-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--txt3);
  margin-bottom: 6px;
}

/* ── TOASTS ─────────────────────────────────────────────────────── */
#toastCont {
  position: fixed;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 500;
}

.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid;
  font-size: 12px;
  max-width: 340px;
  animation: fadeIn .2s ease;
  transition: opacity .28s, transform .28s;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}

.t-ok   { background: var(--green-bg);  color: var(--green);  border-color: var(--green-br); }
.t-err  { background: var(--red-bg);    color: var(--red);    border-color: var(--red-br); }
.t-warn { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-br); }
.t-info { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-br); }

/* ── SPINNER ────────────────────────────────────────────────────── */
.spin {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
  display: inline-block;
}

.spin.dark {
  border-color: rgba(0,0,0,.15);
  border-top-color: var(--blue);
}

/* ── MISC ───────────────────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 40px;
  color: var(--txt3);
  font-size: 12px;
}

.empty-sm {
  padding: 14px;
  text-align: center;
  color: var(--txt3);
  font-size: 11px;
}

.msg-error {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid var(--red-br);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 12px;
}

/* ══════════════════════════════════════════════════════════════════
   ADICIONES v6.1 — Panel inline, traspasos, incidencias
   ══════════════════════════════════════════════════════════════════ */

/* ── TABLA — fila expandida ─────────────────────────────────────── */
.data-row {
  cursor: pointer;
  transition: background .1s;
}

.data-row.row-open td {
  background: color-mix(in srgb, var(--blue-bg) 60%, var(--sur)) !important;
  border-bottom: none;
}

.inline-row { background: transparent; }
.inline-row.hidden { display: none; }

/* ── PANEL INLINE ───────────────────────────────────────────────── */
/* ── PANEL INLINE ───────────────────────────────────────────────── */
.data-row { cursor: pointer; transition: background .1s; }
.data-row.row-open td {
  background: rgba(56,139,253,.06) !important;
  border-bottom: none;
}
.inline-row { background: transparent; }
.inline-row.hidden { display: none; }

.inline-panel {
  padding: 0;
  background: var(--bg3);
  border-top: 1px solid var(--blue-br);
  border-bottom: 1px solid var(--bdr);
  animation: fadeIn .15s ease;
}

.inline-panel-comp { border-top-color: var(--purple-br); }

.inline-comp-banner {
  font-size: 11px; color: var(--purple);
  background: var(--purple-bg); border-bottom: 1px solid var(--purple-br);
  padding: 5px 14px;
}

/* Grid principal: 5 columnas compactas */
.il-grid {
  display: grid;
  grid-template-columns: 155px 165px 185px minmax(140px,1fr) 108px;
  gap: 0;
  align-items: stretch;
  overflow: hidden;
}
.il-grid > .il-col {
  overflow: hidden;
  min-width: 0;
}

.il-col {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 10px 12px;
  border-right: 1px solid var(--bdr);
}

.il-col:last-child { border-right: none; }

.il-label {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px;
  color: var(--txt3); font-family: var(--mono);
  margin-bottom: 6px;
}

.il-section {
  margin-bottom: 8px;
}

.il-section:last-child { margin-bottom: 0; }

/* Tipo de unidad */
.il-tipo-row { display: flex; gap: 3px; flex-wrap: wrap; }

.il-tipo {
  padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--bdr); background: transparent;
  color: var(--txt3); font-size: 10px; font-weight: 500;
  cursor: pointer; transition: all .12s; font-family: var(--font);
}
.il-tipo:hover { border-color: var(--bdr2); color: var(--txt); }
.il-tipo-act { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-br); }

/* Equipo */
.il-equipo-fila {
  display: flex; align-items: center;
  gap: 5px; margin-bottom: 3px;
}
.il-equipo-fila label {
  font-size: 9px; color: var(--txt3);
  min-width: 46px; font-family: var(--mono);
  text-transform: uppercase; letter-spacing: .4px;
  flex-shrink: 0;
}
.il-equipo-fila select {
  flex: 1; min-width: 0; font-size: 10px; padding: 3px 5px;
  background: var(--bg2); border: 1px solid var(--bdr);
  border-radius: var(--radius); color: var(--txt);
  outline: none; appearance: none; font-family: var(--font);
}
.il-equipo-fila select:focus { border-color: var(--blue); }
.il-equipo-fila input[type="text"],
.il-equipo-fila input[type="datetime-local"] {
  flex: 1; min-width: 0; font-size: 10px; padding: 3px 5px;
  background: var(--bg2); border: 1px solid var(--bdr);
  border-radius: var(--radius); color: var(--txt);
  outline: none; font-family: var(--font);
}
.il-equipo-fila input:focus { border-color: var(--blue); }

.il-sin-equipo {
  font-size: 10px; color: var(--txt3);
  padding: 4px 0; font-style: italic;
}

/* Toggles */
.il-tog-row { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 0; }

.il-tog {
  padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--bdr); background: transparent;
  color: var(--txt3); font-size: 10px; font-weight: 500;
  cursor: pointer; transition: all .12s; font-family: var(--font);
}
.il-tog:hover { border-color: var(--bdr2); color: var(--txt); }
.il-tog-act   { background: var(--sur2); color: var(--txt); border-color: var(--bdr2); }
.il-tog-green { background: var(--green-bg)  !important; color: var(--green)  !important; border-color: var(--green-br)  !important; }
.il-tog-blue  { background: var(--blue-bg)   !important; color: var(--blue)   !important; border-color: var(--blue-br)   !important; }
.il-tog-red   { background: var(--red-bg)    !important; color: var(--red)    !important; border-color: var(--red-br)    !important; }

/* Sistemas */
.il-sys-row { display: flex; gap: 3px; flex-wrap: wrap; }

.il-sys {
  padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--bdr); background: transparent;
  color: var(--txt3); font-size: 10px; font-weight: 500;
  cursor: pointer; transition: all .12s; font-family: var(--font);
}
.il-sys-on    { background: var(--green-bg);  color: var(--green);  border-color: var(--green-br); }
.il-sys-off   { background: var(--red-bg);    color: var(--red);    border-color: var(--red-br); }
.il-sys-clima { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-br); }

.il-clima-row {
  display: flex; align-items: center; gap: 5px;
