<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   ALERTAS SAMSARA · GrupoGal — Hoja de estilos
   ═════════════════════════════════════════════════════════════════════════════ */

/* ── Variables locales ────────────────────────────────────────────────────────── */
:root {
  --bg1: var(--color-background-primary);
  --bg2: var(--color-background-secondary);
  --b1:  var(--color-border-tertiary);
  --b2:  var(--color-border-secondary);
  --txt1: var(--color-text-primary);
  --txt2: var(--color-text-secondary);
}

/* ── Layout general ──────────────────────────────────────────────────────────── */
/* Fix 1: sin sidebar en alertas */
#main {
  margin-left: 0 !important;
}
/* Fix 2: modal opaco */
.modal-bg {
  position: fixed !important;
  inset: 0 !important;
  background: rgba(0,0,0,0.65) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  z-index: 1000 !important;
  backdrop-filter: blur(2px);
  /* Oculto por defecto; JS añade/quita .hidden */
}

.modal-bg.hidden {
  display: none !important;
}

.modal-bg .modal {
  background: #1c2128 !important;   /* var(--bg3) hardcoded como fallback */
  border: 1px solid #444c56 !important;
  box-shadow: 0 16px 48px rgba(0,0,0,0.8) !important;
  position: relative;
  z-index: 1001;
}

/* Fix select modal */
.modal-bg .modal select {
  background: #1c2128 !important;
  color: #e6edf3 !important;
  border: 1px solid #444c56 !important;
}

.modal-bg .modal select option {
  background: #1c2128;
  color: #e6edf3;
}


.alertas-container {
  max-width: 1400px;
  margin: 0 auto;
}

.view-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}

.vh-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--txt1);
}

.vh-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

/* ── Pestañas ────────────────────────────────────────────────────────────────── */
.tabs-nav {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--b1);
  margin-bottom: 20px;
}

.tab-btn {
  padding: 10px 18px;
  font-size: 13px;
  color: var(--txt2);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
}

.tab-btn.active {
  color: var(--txt1);
  border-bottom-color: #378ADD;
  font-weight: 500;
}

.tab-btn:hover:not(.active) {
  color: var(--txt1);
}

.tab-btn.hidden {
  display: none;
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

/* ── KPIs (indicadores principales) ──────────────────────────────────────────── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.kpi {
  background: var(--bg2);
  border-radius: 8px;
  padding: 14px 16px;
}

.kpi-val {
  font-size: 26px;
  font-weight: 500;
  color: var(--txt1);
  line-height: 1;
}

.kpi-lbl {
  font-size: 12px;
  color: var(--txt2);
  margin-top: 4px;
}

.kpi-sub {
  font-size: 11px;
  margin-top: 2px;
}

.trend-up {
  color: #3B6D11;
}

.trend-dn {
  color: #A32D2D;
}

/* ── Paneles ─────────────────────────────────────────────────────────────────── */
.panel {
  background: var(--bg1);
  border: 0.5px solid var(--b1);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}

.panel-head {
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--b1);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--txt1);
}

/* ── Tablas ──────────────────────────────────────────────────────────────────── */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  padding: 9px 14px;
  text-align: left;
  color: var(--txt2);
  font-weight: 500;
  border-bottom: 0.5px solid var(--b1);
  font-size: 11px;
  white-space: nowrap;
}

td {
  padding: 9px 14px;
  border-bottom: 0.5px solid var(--b1);
  color: var(--txt1);
  vertical-align: middle;
}

tr:last-child td {
  border-bottom: none;
}

tr:hover td {
  background: var(--bg2);
}

/* ── Badges ──────────────────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

.b-red {
  background: #FCEBEB;
  color: #A32D2D;
}

.b-green {
  background: #EAF3DE;
  color: #3B6D11;
}

.b-amber {
  background: #FAEEDA;
  color: #854F0B;
}

.b-blue {
  background: #E6F1FB;
  color: #185FA5;
}

.b-gray {
  background: #F1EFE8;
  color: #5F5E5A;
}

/* ── Barra de progreso ───────────────────────────────────────────────────────── */
.pct-bar {
  background: var(--bg2);
  border-radius: 4px;
  height: 6px;
  width: 100px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}

.pct-fill {
  height: 100%;
  border-radius: 4px;
}

/* ── Ranking (posiciones) ────────────────────────────────────────────────────── */
.rank {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  background: var(--bg2);
  color: var(--txt2);
}

.rank-1 {
  background: #FAEEDA;
  color: #854F0B;
}

.rank-2 {
  background: #F1EFE8;
  color: #5F5E5A;
}

.rank-3 {
  background: #FAECE7;
  color: #993C1D;
}

/* ── Formularios y controles ─────────────────────────────────────────────────── */
.fil-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.fil-row select,
.fil-row input[type="date"] {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 0.5px solid var(--b1);
  background: var(--bg1);
  color: var(--txt1);
}

.inp-date {
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 8px;
  border: 0.5px solid var(--b1);
  background: var(--bg1);
  color: var(--txt1);
}

.inp-select {
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 8px;
  border: 0.5px solid var(--b1);
  background: var(--bg1);
  color: var(--txt1);
}

/* ── Botones ─────────────────────────────────────────────────────────────────── */
.btn-sm {
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 0.5px solid var(--b2);
  background: var(--bg1);
  color: var(--txt1);
  cursor: pointer;
}

.btn-sm:hover {
  background: var(--bg2);
}

.btn-xs {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 6px;
  border: 0.5px solid var(--b2);
  background: var(--bg1);
  color: var(--txt1);
  cursor: pointer;
}

.btn-xs:hover {
  background: var(--bg2);
}

.btn-sm-primary {
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 8px;
  border: none;
  background: #378ADD;
  color: #fff;
  cursor: pointer;
}

.btn-sm-primary:hover {
  background: #185FA5;
}

.btn-primary {
  font-size: 13px;
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  background: #378ADD;
  color: #fff;
  cursor: pointer;
  font-weight: 500;
}

.btn-primary:hover {
  background: #185FA5;
}

.btn-ghost {
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 0.5px solid var(--b2);
  background: transparent;
  color: var(--txt1);
  cursor: pointer;
}

.btn-icon {
  padding: 5px 8px;
  border-radius: 8px;
  border: 0.5px solid var(--b1);
  background: var(--bg1);
  color: var(--txt1);
  cursor: pointer;
}

/* ── Leyendas ────────────────────────────────────────────────────────────────── */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
  color: var(--txt2);
  margin-bottom: 10px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}

/* ── Estados de tabla ────────────────────────────────────────────────────────── */
.tbl-empty {
  text-align: center;
  padding: 32px;
  color: var(--txt2);
  font-size: 13px;
}

.tbl-loading {
  display: flex;
  justify-content: center;
  padding: 32px;
}

/* ── Animación de alerta urgente ─────────────────────────────────────────────── */
@keyframes pulse-row {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.6;
  }
}

.row-alerta td {
  background: #FFF3F3 !important;
}

.row-alerta-pulse {
  animation: pulse-row 1.5s ease-in-out infinite;
}

/* ── Badge de temporizador ───────────────────────────────────────────────────── */
.timer-badge {
  font-family: monospace;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
}

.timer-ok {
  background: #EAF3DE;
  color: #3B6D11;
}

.timer-warn {
  background: #FAEEDA;
  color: #854F0B;
}

.timer-crit {
  background: #FCEBEB;
  color: #A32D2D;
}

/* ── Grid de 2 columnas (desempeño) ──────────────────────────────────────────── */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

@media (max-width: 700px) {
  .grid-2 {
    grid-template-columns: 1fr;
  }

  .kpi-row {
    grid-template-columns: repeat(2, 1fr);
  }
}

</style>
